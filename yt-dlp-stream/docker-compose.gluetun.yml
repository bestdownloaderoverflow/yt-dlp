services:
  # --- Pair 1 ---
  gluetun-1:
    image: qmcgaw/gluetun:v3.41.1
    container_name: ytdlp-gluetun-1
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8001:8000"
      - "9487:9487"
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=IDl1n4COJEW+X15pCtsetjgvqJcJGM3Gfk0CqTZwmHo=
      - WIREGUARD_ADDRESSES=10.64.74.105/32
      - SERVER_COUNTRIES=USA
      - DNS_ADDRESS=10.64.0.1
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_LOG=on
      - "HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={\"auth\":\"basic\",\"username\":\"admin\",\"password\":\"${GLUETUN_PASSWORD:-secretpassword}\"}"
    volumes:
      - ./gluetun/data1:/gluetun
    restart: unless-stopped
    networks:
      - ytdlp-network
    extra_hosts:
      - "host.docker.internal:172.17.0.1"

  ytdlp-1:
    build:
      context: ..
      dockerfile: yt-dlp-stream/Dockerfile
      target: base
    container_name: ytdlp-stream-1
    network_mode: "service:gluetun-1"
    depends_on:
      - gluetun-1
      - redis
    environment:
      - WORKER_ID=w1
      - API_PORT=9487
      - STREAM_SECRET_KEY=${STREAM_SECRET_KEY:-dev-secret-key}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PYTHONPATH=/app:/app/yt_dlp
      # Gluetun workers cannot resolve Docker service DNS reliably, so use Redis static IP.
      - REDIS_URL=redis://172.30.0.250:6379/0
      - GLUETUN_HOST=localhost
      - GLUETUN_PORT=8000
      - GLUETUN_USERNAME=admin
      - GLUETUN_PASSWORD=${GLUETUN_PASSWORD:-secretpassword}
    restart: unless-stopped

  # --- Pair 2 ---
  gluetun-2:
    image: qmcgaw/gluetun:v3.41.1
    container_name: ytdlp-gluetun-2
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8002:8000"
      - "9488:9487"
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=CCSyx4mZNF9bYGxUwVrm7IaynxQYEsyQD6kod6Eak0g=
      - WIREGUARD_ADDRESSES=10.72.62.15/32
      - SERVER_COUNTRIES=USA
      - DNS_ADDRESS=10.64.0.1
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_LOG=on
      - "HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={\"auth\":\"basic\",\"username\":\"admin\",\"password\":\"${GLUETUN_PASSWORD:-secretpassword}\"}"
    volumes:
      - ./gluetun/data2:/gluetun
    restart: unless-stopped
    networks:
      - ytdlp-network
    extra_hosts:
      - "host.docker.internal:172.17.0.1"

  ytdlp-2:
    build:
      context: ..
      dockerfile: yt-dlp-stream/Dockerfile
      target: base
    container_name: ytdlp-stream-2
    network_mode: "service:gluetun-2"
    depends_on:
      - gluetun-2
      - redis
    environment:
      - WORKER_ID=w2
      - API_PORT=9487
      - STREAM_SECRET_KEY=${STREAM_SECRET_KEY:-dev-secret-key}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PYTHONPATH=/app:/app/yt_dlp
      - REDIS_URL=redis://172.30.0.250:6379/0
      - GLUETUN_HOST=localhost
      - GLUETUN_PORT=8000
      - GLUETUN_USERNAME=admin
      - GLUETUN_PASSWORD=${GLUETUN_PASSWORD:-secretpassword}
    restart: unless-stopped

  # --- Pair 3 ---
  gluetun-3:
    image: qmcgaw/gluetun:v3.41.1
    container_name: ytdlp-gluetun-3
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8003:8000"
      - "9489:9487"
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=CBznnCKlpyHtQh0d++gnD6yJTmY6nNQcoCtx2vHPD20=
      - WIREGUARD_ADDRESSES=10.74.126.192/32
      - SERVER_COUNTRIES=USA
      - DNS_ADDRESS=10.64.0.1
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_LOG=on
      - "HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={\"auth\":\"basic\",\"username\":\"admin\",\"password\":\"${GLUETUN_PASSWORD:-secretpassword}\"}"
    volumes:
      - ./gluetun/data3:/gluetun
    restart: unless-stopped
    networks:
      - ytdlp-network
    extra_hosts:
      - "host.docker.internal:172.17.0.1"

  ytdlp-3:
    build:
      context: ..
      dockerfile: yt-dlp-stream/Dockerfile
      target: base
    container_name: ytdlp-stream-3
    network_mode: "service:gluetun-3"
    depends_on:
      - gluetun-3
      - redis
    environment:
      - WORKER_ID=w3
      - API_PORT=9487
      - STREAM_SECRET_KEY=${STREAM_SECRET_KEY:-dev-secret-key}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PYTHONPATH=/app:/app/yt_dlp
      - REDIS_URL=redis://172.30.0.250:6379/0
      - GLUETUN_HOST=localhost
      - GLUETUN_PORT=8000
      - GLUETUN_USERNAME=admin
      - GLUETUN_PASSWORD=${GLUETUN_PASSWORD:-secretpassword}
    restart: unless-stopped

  # --- Redis (for session cache) ---
  redis:
    image: redis:7-alpine
    container_name: ytdlp-redis
    volumes:
      - redis-data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      ytdlp-network:
        ipv4_address: 172.30.0.250

  # --- Go Smart Gateway ---
  gateway:
    build:
      context: .
      dockerfile: gateway-go/Dockerfile
    container_name: ytdlp-gateway
    ports:
      - "9111:9111"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - GATEWAY_PORT=9111
      - WORKER_COUNT=3
      - GLUETUN_PASSWORD=${GLUETUN_PASSWORD:-secretpassword}
      - MAX_RETRIES=3
      - RATE_LIMIT_COOLDOWN=300
    depends_on:
      - gluetun-1
      - gluetun-2
      - gluetun-3
      - ytdlp-1
      - ytdlp-2
      - ytdlp-3
    restart: unless-stopped
    networks:
      - ytdlp-network

networks:
  ytdlp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  redis-data:
