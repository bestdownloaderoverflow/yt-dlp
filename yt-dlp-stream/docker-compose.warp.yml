services:
  gluetun-1:
    image: qmcgaw/gluetun:v3.41.1
    container_name: ytdlp-gluetun-1
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8001:8000"
      - "9487:9487"
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=mJNxbqpODxFWrNpoJnNJt3GAZaegIFuiY6XQekl0zkI=
      - WIREGUARD_ADDRESSES=172.16.0.2/32
      - WIREGUARD_MTU=1100
      - WIREGUARD_PUBLIC_KEY=bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
      - WIREGUARD_ENDPOINT_IP=162.159.192.1
      - WIREGUARD_ENDPOINT_PORT=2408
      - DNS_ADDRESS=1.1.1.1
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_LOG=on
      - "HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={\"auth\":\"basic\",\"username\":\"admin\",\"password\":\"${GLUETUN_PASSWORD:-secretpassword}\"}"
    volumes:
      - ./gluetun/data1:/gluetun
    restart: unless-stopped
    networks:
      ytdlp-warp-network:
        aliases:
          - gluetun-1
    extra_hosts:
      - "host.docker.internal:172.17.0.1"

  ytdlp-1:
    build:
      context: ..
      dockerfile: yt-dlp-stream/Dockerfile
      target: base
    container_name: ytdlp-stream-1
    network_mode: "service:gluetun-1"
    depends_on:
      - gluetun-1
      - redis
    environment:
      - WORKER_ID=w1
      - API_PORT=9487
      - STREAM_SECRET_KEY=${STREAM_SECRET_KEY:-dev-secret-key}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PYTHONPATH=/app:/app/yt_dlp
      - REDIS_URL=redis://172.30.0.250:6379/0
      - GLUETUN_HOST=localhost
      - GLUETUN_PORT=8000
      - GLUETUN_USERNAME=admin
      - GLUETUN_PASSWORD=${GLUETUN_PASSWORD:-secretpassword}
    restart: unless-stopped

  gluetun-2:
    image: qmcgaw/gluetun:v3.41.1
    container_name: ytdlp-gluetun-2
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8002:8000"
      - "9488:9487"
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=AHWtP0AqdW2jTMkx8iS2gwND5T0xGcy/t2/cf9Z2R0c=
      - WIREGUARD_ADDRESSES=172.16.0.2/32
      - WIREGUARD_MTU=1100
      - WIREGUARD_PUBLIC_KEY=bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
      - WIREGUARD_ENDPOINT_IP=162.159.192.1
      - WIREGUARD_ENDPOINT_PORT=2408
      - DNS_ADDRESS=1.1.1.1
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_LOG=on
      - "HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={\"auth\":\"basic\",\"username\":\"admin\",\"password\":\"${GLUETUN_PASSWORD:-secretpassword}\"}"
    volumes:
      - ./gluetun/data2:/gluetun
    restart: unless-stopped
    networks:
      ytdlp-warp-network:
        aliases:
          - gluetun-2
    extra_hosts:
      - "host.docker.internal:172.17.0.1"

  ytdlp-2:
    build:
      context: ..
      dockerfile: yt-dlp-stream/Dockerfile
      target: base
    container_name: ytdlp-stream-2
    network_mode: "service:gluetun-2"
    depends_on:
      - gluetun-2
      - redis
    environment:
      - WORKER_ID=w2
      - API_PORT=9487
      - STREAM_SECRET_KEY=${STREAM_SECRET_KEY:-dev-secret-key}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PYTHONPATH=/app:/app/yt_dlp
      - REDIS_URL=redis://172.30.0.250:6379/0
      - GLUETUN_HOST=localhost
      - GLUETUN_PORT=8000
      - GLUETUN_USERNAME=admin
      - GLUETUN_PASSWORD=${GLUETUN_PASSWORD:-secretpassword}
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ytdlp-redis
    volumes:
      - redis-data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      ytdlp-warp-network:
        ipv4_address: 172.30.0.250

  gateway-warp:
    build:
      context: .
      dockerfile: gateway-go/Dockerfile
    container_name: ytdlp-gateway-warp
    ports:
      - "9111:9111"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - GATEWAY_PORT=9111
      - WORKER_COUNT=2
      - GLUETUN_PASSWORD=${GLUETUN_PASSWORD:-secretpassword}
      - MAX_RETRIES=3
      - RATE_LIMIT_COOLDOWN=300
      - DRAIN_POLL_INTERVAL_MS=350
      - DRAIN_TIMEOUT_SECONDS=120
      - RESTART_BACKOFF_BASE=10
      - RESTART_BACKOFF_MAX=90
      - RESTART_BACKOFF_JITTER=2
      - DEGRADED_RETRY_AFTER=5
      - RESTART_STABILIZE_SECONDS=5
    depends_on:
      - gluetun-1
      - gluetun-2
      - ytdlp-1
      - ytdlp-2
      - redis
    restart: unless-stopped
    networks:
      - ytdlp-warp-network

networks:
  ytdlp-warp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  redis-data:
