  ytdlp-worker-4:
    <<: *ytdlp-worker-common
    container_name: ytdlp-worker-4
    volumes:
      - worker4-cookies:/tmp/ytdlp_cookies
    environment:
      - WORKER_ID=w4
      - API_PORT=9487
      - GRANIAN_WORKERS=2
      - STREAM_SECRET_KEY=${STREAM_SECRET_KEY:-dev-secret-key}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PYTHONPATH=/app:/app/yt_dlp
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0

  redis:
    image: redis:7-alpine
    container_name: ytdlp-redis
    volumes:
      - redis-data:/data
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD} --appendonly yes --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      ytdlp-warp-network:
        ipv4_address: 172.30.0.250

  gateway-warp:
    build:
      context: .
      dockerfile: gateway-go/Dockerfile
    container_name: ytdlp-gateway-warp
    ports:
      - "9111:9111"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - GATEWAY_PORT=9111
      - WORKER_COUNT=4
      - PROXY_COUNT=10
      - WORKER_HOST_PREFIX=ytdlp-worker-
      - WORKER_CONTAINER_PREFIX=ytdlp-worker-
      - WORKER_API_PORT=9487
      - PROXY_HOST_PREFIX=gluetun-
      - PROXY_CONTAINER_PREFIX=ytdlp-gluetun-
      - PROXY_HTTP_PORT=8888
      - PROXY_CONTROL_PORT=8000
      - MAX_ACTIVE_PER_WORKER=${MAX_ACTIVE_PER_WORKER:-300}
      - MAX_ACTIVE_PER_PROXY=${MAX_ACTIVE_PER_PROXY:-300}
      - WORKER_PICK_STRATEGY=${WORKER_PICK_STRATEGY:-p2c}
      - GLUETUN_PASSWORD=${GLUETUN_PASSWORD:-secretpassword}
      - MAX_RETRIES=3
      - HEALTH_CHECK_TIMEOUT_MS=15000
      - HEALTH_MONITOR_INTERVAL_MS=5000
      - HEALTH_FAILURE_THRESHOLD=3
      - RATE_LIMIT_COOLDOWN=300
      - DRAIN_POLL_INTERVAL_MS=350
      - DRAIN_TIMEOUT_SECONDS=120
      - RESTART_BACKOFF_BASE=10
      - RESTART_BACKOFF_MAX=90
      - RESTART_BACKOFF_JITTER=2
      - DEGRADED_RETRY_AFTER=5
      - RESTART_STABILIZE_SECONDS=5
      - UNHEALTHY_RESTART_THRESHOLD=6
      - GATEWAY_READ_HEADER_TIMEOUT_SECONDS=10
      - GATEWAY_READ_TIMEOUT_SECONDS=30
      - GATEWAY_WRITE_TIMEOUT_SECONDS=0
      - GATEWAY_IDLE_TIMEOUT_SECONDS=120
    depends_on:
      - gluetun-1
      - gluetun-2
      - gluetun-3
      - gluetun-4
      - gluetun-5
      - gluetun-6
      - gluetun-7
      - gluetun-8
      - gluetun-9
      - gluetun-10
      - ytdlp-worker-1
      - ytdlp-worker-2
      - ytdlp-worker-3
      - ytdlp-worker-4
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9111/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ytdlp-warp-network

networks:
  ytdlp-warp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  redis-data:
  worker1-cookies:
  worker2-cookies:
  worker3-cookies:
  worker4-cookies:
