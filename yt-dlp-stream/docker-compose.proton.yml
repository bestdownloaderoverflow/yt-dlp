      - /dev/net/tun:/dev/net/tun
    ports:
      - "8013:8000"
      - "9499:9487"
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY_13}
      - SERVER_COUNTRIES=Singapore
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_LOG=off
      - "HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={\"auth\":\"basic\",\"username\":\"admin\",\"password\":\"${GLUETUN_PASSWORD:-secretpassword}\"}"
      - HTTPPROXY=on
      - HTTPPROXY_LOG=off
    volumes:
      - ./gluetun/data13:/gluetun
    restart: unless-stopped
    networks:
      ytdlp-warp-network:
        aliases:
          - gluetun-13
    extra_hosts:
      - "host.docker.internal:172.17.0.1"

  ytdlp-13:
    build:
      context: ..
      dockerfile: yt-dlp-stream/Dockerfile
      target: base
    container_name: ytdlp-stream-13
    network_mode: "service:gluetun-13"
    depends_on:
      - gluetun-13
      - redis
    environment:
      - WORKER_ID=w13
      - STREAM_SECRET_KEY=${STREAM_SECRET_KEY:-dev-secret-key}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TIKTOK_EXTRACT_CACHE_TTL_SECONDS=1800
      - PYTHONPATH=/app:/app/yt_dlp
      - REDIS_URL=redis://172.30.0.250:6379/0
      - GLUETUN_HOST=localhost
      - GLUETUN_PORT=8000
      - GLUETUN_USERNAME=admin
      - GLUETUN_PASSWORD=${GLUETUN_PASSWORD:-secretpassword}
    command: ["python", "extractor/worker_server.py"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ytdlp-redis
    volumes:
      - redis-data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      ytdlp-warp-network:
        ipv4_address: 172.30.0.250

  gateway-warp:
    build:
      context: .
      dockerfile: gateway-go/Dockerfile
    container_name: ytdlp-gateway-warp
    ports:
      - "9111:9111"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - GATEWAY_PORT=9111
      - WORKER_COUNT=13
      - EXTRACTOR_IPC_ENABLED=true
      - EXTRACTOR_TIMEOUT_MS=90000
      - MAX_WORKER_IPC_CONCURRENCY=4
      - GLUETUN_PASSWORD=${GLUETUN_PASSWORD:-secretpassword}
      - MAX_RETRIES=3
      - HEALTH_CHECK_TIMEOUT_MS=15000
      - HEALTH_MONITOR_INTERVAL_MS=5000
      - HEALTH_FAILURE_THRESHOLD=3
      - RATE_LIMIT_COOLDOWN=300
      - DRAIN_POLL_INTERVAL_MS=350
      - DRAIN_TIMEOUT_SECONDS=120
      - RESTART_BACKOFF_BASE=10
      - RESTART_BACKOFF_MAX=90
      - RESTART_BACKOFF_JITTER=2
      - DEGRADED_RETRY_AFTER=5
      - DEGRADED_TIMEOUT_SECONDS=30
      - RESTART_STABILIZE_SECONDS=5
      - UNHEALTHY_RESTART_THRESHOLD=6
    depends_on:
      - gluetun-1
      - gluetun-2
      - gluetun-3
      - gluetun-4
      - gluetun-5
      - gluetun-6
      - gluetun-7
      - gluetun-8
      - gluetun-9
      - gluetun-10
      - gluetun-11
      - gluetun-12
      - gluetun-13
      - ytdlp-1
      - ytdlp-2
      - ytdlp-3
      - ytdlp-4
      - ytdlp-5
      - ytdlp-6
      - ytdlp-7
      - ytdlp-8
      - ytdlp-9
      - ytdlp-10
      - ytdlp-11
      - ytdlp-12
      - ytdlp-13
      - redis
    restart: unless-stopped
    networks:
      - ytdlp-warp-network

networks:
  ytdlp-warp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  redis-data:
