x-wireproxy: &wireproxy
  build:
    context: .
    dockerfile: wireproxy/Dockerfile
  image: ytdlp-wireproxy:v1.1.2
  command: ["--config", "/etc/wireproxy/wireproxy.conf", "--info", "0.0.0.0:9080"]

x-ytdlp-worker: &ytdlp_worker {}

x-gateway: &gateway {}

services:
  wireproxy-01:
    <<: *wireproxy
    container_name: wireproxy-01
    volumes:
      - ./runtime-configs/wireproxy-01.conf:/etc/wireproxy/wireproxy.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9080/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ytdlp-wireproxy-network

