    environment:
      - WORKER_ID=w5
      - API_PORT=9487
      - STREAM_SECRET_KEY=${STREAM_SECRET_KEY:-dev-secret-key}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PYTHONPATH=/app:/app/yt_dlp
      - REDIS_URL=redis://172.30.0.250:6379/0
      - GLUETUN_HOST=localhost
      - GLUETUN_PORT=8000
      - GLUETUN_USERNAME=admin
      - GLUETUN_PASSWORD=${GLUETUN_PASSWORD:-secretpassword}
    restart: unless-stopped

  # --- Redis (for session cache) ---
  redis:
    image: redis:7-alpine
    container_name: ytdlp-redis
    volumes:
      - redis-data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      ytdlp-network:
        ipv4_address: 172.30.0.250

  # --- Go Smart Gateway ---
  gateway:
    build:
      context: .
      dockerfile: gateway-go/Dockerfile
    container_name: ytdlp-gateway
    ports:
      - "9111:9111"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - GATEWAY_PORT=9111
      - WORKER_COUNT=5
      - GLUETUN_PASSWORD=${GLUETUN_PASSWORD:-secretpassword}
      - MAX_RETRIES=2
      - RATE_LIMIT_COOLDOWN=60
      - DRAIN_POLL_INTERVAL_MS=350
      - DRAIN_TIMEOUT_SECONDS=25
      - RESTART_BACKOFF_BASE=10
      - RESTART_BACKOFF_MAX=90
      - RESTART_BACKOFF_JITTER=2
      - DEGRADED_RETRY_AFTER=2
    depends_on:
      - gluetun-1
      - gluetun-2
      - gluetun-3
      - ytdlp-1
      - ytdlp-2
      - ytdlp-3
      - gluetun-4
      - gluetun-5
      - ytdlp-4
      - ytdlp-5
    restart: unless-stopped
    networks:
      - ytdlp-network

networks:
  ytdlp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  redis-data:
