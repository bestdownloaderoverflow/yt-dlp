services:
  gluetun-1:
    &gluetun-common
    image: qmcgaw/gluetun:v3.41.1
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    container_name: ytdlp-gluetun-1
    networks:
      ytdlp-warp-network:
        aliases:
          - gluetun-1
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - SERVER_COUNTRIES=Indonesia
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_LOG=off
      - HTTPPROXY=on
      - HTTPPROXY_LISTENING_ADDRESS=:8888
      - HTTPPROXY_LOG=off
      - "HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={\"auth\":\"basic\",\"username\":\"admin\",\"password\":\"${GLUETUN_PASSWORD:-secretpassword}\"}"
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY_1}
    volumes:
      - ./gluetun/data1:/gluetun

