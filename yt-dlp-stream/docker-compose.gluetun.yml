      - WIREGUARD_PRIVATE_KEY=uIpmRzdi9sPGT+gnMs9L5GSGRgY5SlcqrYcEp2iwAn0=
      - WIREGUARD_ADDRESSES=10.66.27.250/32
      - SERVER_COUNTRIES=USA
      - DNS_ADDRESS=10.64.0.1
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_LOG=on
