      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0

  ytdlp-worker-3:
    <<: *ytdlp-worker-common
    container_name: ytdlp-worker-3
    volumes:
      - worker3-cookies:/tmp/ytdlp_cookies
