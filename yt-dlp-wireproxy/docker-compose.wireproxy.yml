      retries: 3
      start_period: 10s
    networks:
      - ytdlp-wireproxy-network

  redis:
    image: redis:7-alpine
    container_name: ytdlp-redis-wireproxy
    volumes:
      - redis-data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - ytdlp-wireproxy-network

  tiktok-ssr-engine:
    build:
      context: ../tiktok-ssr-engine
      dockerfile: Dockerfile
    image: tiktok-ssr-engine:latest
    container_name: tiktok-ssr-engine
    ports:
      - "9111:9111"
    environment:
      - PORT=9111
      - PROXY_COUNT=50
      - PROXY_HOST_PREFIX=wireproxy
      - PROXY_PORT=1080
      - TIKTOK_API_KEY=${TIKTOK_API_KEY}
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - ./cookie/cookie.txt:/app/cookie/cookie.txt:ro
    depends_on:
      - redis
      - wireproxy-01
      - wireproxy-02
      - wireproxy-03
      - wireproxy-04
