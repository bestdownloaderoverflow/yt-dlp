  redis:
    image: redis:7-alpine
    container_name: ytdlp-redis-wireproxy
    volumes:
      - redis-data:/data
    # Sessions hold live download links for an hour and share this instance with
    # the extraction cache. Measured at ~8KB per extraction, 256mb overflowed at
    # roughly 5 req/s sustained and allkeys-lru then evicted live sessions,
    # which surfaces to users as download links that expire on arrival.
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ytdlp-wireproxy-network

  tiktok-ssr-engine:
    build:
      context: ../tiktok-ssr-engine
      dockerfile: Dockerfile
    image: tiktok-ssr-engine:latest
    container_name: tiktok-ssr-engine
    ports:
      - "9111:9111"
    environment:
      - PORT=9111
      - PROXY_COUNT=21
      - PROXY_HOST_PREFIX=wireproxy
      - PROXY_PORT=1080
      - INDONESIA_PROXIES=1,13,14
      - TIKTOK_API_KEY=${TIKTOK_API_KEY}
      - REDIS_URL=redis://redis:6379/1
      - ALLOW_DIRECT_DOWNLOAD_FALLBACK=false
      - DOWNLOAD_PROXY_ATTEMPTS=3
      - PROBE_TIMEOUT=12
      - PROBE_DEAD_AFTER=3
    volumes:
      - ./cookie/cookie.txt:/app/cookie/cookie.txt:ro
    depends_on:
      - redis
      - wireproxy-01
      - wireproxy-02
      - wireproxy-03
      - wireproxy-04
      - wireproxy-05
      - wireproxy-06
      - wireproxy-07
      - wireproxy-08
      - wireproxy-09
      - wireproxy-10
      - wireproxy-11
      - wireproxy-12
      - wireproxy-13
      - wireproxy-14
      - wireproxy-15
      - wireproxy-16
      - wireproxy-17
      - wireproxy-18
      - wireproxy-19
      - wireproxy-20
      - wireproxy-21
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9111/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - ytdlp-wireproxy-network

networks:
  ytdlp-wireproxy-network:
    driver: bridge

volumes:
  redis-data:
