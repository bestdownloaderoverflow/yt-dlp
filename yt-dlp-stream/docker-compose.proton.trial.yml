  redis:
    image: redis:7-alpine
    container_name: ytdlp-redis
    volumes:
      - redis-data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      ytdlp-proton-trial-network:
        ipv4_address: 172.30.0.250

  gateway-proton-trial:
    build:
      context: .
      dockerfile: gateway-go/Dockerfile
    container_name: ytdlp-gateway-proton-trial
    ports:
      - "9111:9111"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - GATEWAY_PORT=9111
      - WORKER_COUNT=5
      - EXTRACTOR_IPC_ENABLED=true
      - YOUTUBE_FETCH_IPV6_ONLY=false
      - GLUETUN_PASSWORD=${GLUETUN_PASSWORD:-secretpassword}
      - MAX_RETRIES=3
      - HEALTH_CHECK_TIMEOUT_MS=15000
      - HEALTH_MONITOR_INTERVAL_MS=5000
      - HEALTH_FAILURE_THRESHOLD=3
      - RATE_LIMIT_COOLDOWN=300
      - DRAIN_POLL_INTERVAL_MS=350
      - DRAIN_TIMEOUT_SECONDS=120
      - RESTART_BACKOFF_BASE=10
      - RESTART_BACKOFF_MAX=90
      - RESTART_BACKOFF_JITTER=2
      - DEGRADED_RETRY_AFTER=5
      - DEGRADED_TIMEOUT_SECONDS=30
      - RESTART_STABILIZE_SECONDS=5
      - UNHEALTHY_RESTART_THRESHOLD=6
    depends_on:
      - gluetun-1
      - gluetun-2
      - gluetun-3
      - gluetun-4
      - gluetun-5
      - ytdlp-1
      - ytdlp-2
      - ytdlp-3
      - ytdlp-4
      - ytdlp-5
      - redis
    restart: unless-stopped
    networks:
      - ytdlp-proton-trial-network

networks:
  ytdlp-proton-trial-network:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
        - subnet: fd00:30::/64

volumes:
  redis-data:
