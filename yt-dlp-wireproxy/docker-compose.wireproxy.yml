x-wireproxy: &wireproxy
  build:
    context: .
    dockerfile: wireproxy/Dockerfile
  image: ytdlp-wireproxy:v1.1.2
  command: ["--config", "/etc/wireproxy/wireproxy.conf", "--info", "0.0.0.0:9080"]

# Tunnels only need to have been started: readiness is the engine's own liveness
# prober's job, and gating on service_healthy would let one bad tunnel keep the
# whole service down instead of running on the remaining twenty.
x-tunnel-started: &tunnel_started
  condition: service_started

# Proxy pool layout (generated by scripts/generate-wireproxy-configs.py):
#   wireproxy-01 .. wireproxy-12  Surfshark  IPv4
#   wireproxy-13 .. wireproxy-17  Mullvad    IPv4
#   wireproxy-18 .. wireproxy-21  Cloudflare WARP
# Each geo key is pointed at a randomly chosen server across ID,SG,VN,MY,TH,PH,
# so re-running the generator rerolls the exit IPs. HK is deliberately excluded:
# TikTok 302s Hong Kong exits to /hk/about, so they pass health checks but cannot
# scrape. The generator prints which indexes landed in Indonesia -- keep
# INDONESIA_PROXIES in sync with that.

services:
  wireproxy-01:
    <<: *wireproxy
    container_name: wireproxy-01
    environment:
      - WIREPROXY_RECONNECT_MARKER=/var/run/wireproxy-reconnect/wireproxy-01
    volumes:
      - ./runtime-configs/wireproxy-01.conf:/etc/wireproxy/wireproxy.conf:ro
      - warp-reconnect-signals:/var/run/wireproxy-reconnect:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9080/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ytdlp-wireproxy-network

