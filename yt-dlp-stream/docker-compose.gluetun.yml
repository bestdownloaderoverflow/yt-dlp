  # --- Pair 5 ---
  gluetun-5:
    image: qmcgaw/gluetun:v3.41.1
    container_name: ytdlp-gluetun-5
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8005:8000"
      - "9491:9487"
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=yAPIvHkB2UztF9q6BeZT7p9Cv5W0hcfjaYs5KmDYRU4=
      - WIREGUARD_ADDRESSES=10.66.27.121/32
      - WIREGUARD_MTU=1100
      - SERVER_COUNTRIES=USA
      - DNS_ADDRESS=10.64.0.1
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_LOG=on
      - "HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={\"auth\":\"basic\",\"username\":\"admin\",\"password\":\"${GLUETUN_PASSWORD:-secretpassword}\"}"
    volumes:
      - ./gluetun/data5:/gluetun
    restart: unless-stopped
