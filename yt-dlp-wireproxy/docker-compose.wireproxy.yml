  redis:
    image: redis:7-alpine
    container_name: ytdlp-redis-wireproxy
    volumes:
      - redis-data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - ytdlp-wireproxy-network

  tiktok-ssr-engine:
    build:
      context: ../tiktok-ssr-engine
      dockerfile: Dockerfile
    image: tiktok-ssr-engine:latest
    container_name: tiktok-ssr-engine
    ports:
      - "9111:9111"
    environment:
      - PORT=9111
      - PROXY_COUNT=18
      - PROXY_HOST_PREFIX=wireproxy
      - PROXY_PORT=1080
      - TIKTOK_API_KEY=${TIKTOK_API_KEY}
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - ./cookie/cookie.txt:/app/cookie/cookie.txt:ro
    depends_on:
      - redis
      - wireproxy-01
      - wireproxy-02
      - wireproxy-03
      - wireproxy-04
      - wireproxy-05
      - wireproxy-06
      - wireproxy-07
      - wireproxy-08
      - wireproxy-09
      - wireproxy-10
      - wireproxy-11
      - wireproxy-12
      - wireproxy-13
      - wireproxy-14
      - wireproxy-15
      - wireproxy-16
      - wireproxy-17
      - wireproxy-18
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - ytdlp-wireproxy-network

networks:
  ytdlp-wireproxy-network:
    driver: bridge

volumes:
  redis-data:

