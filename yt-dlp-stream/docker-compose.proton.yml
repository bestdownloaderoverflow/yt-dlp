      - "HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={\"auth\":\"basic\",\"username\":\"admin\",\"password\":\"${GLUETUN_PASSWORD:-secretpassword}\"}"
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY_10}
    volumes:
      - ./gluetun/data10:/gluetun

  ytdlp-worker-1:
    &ytdlp-worker-common
    build:
      context: ..
      dockerfile: yt-dlp-stream/Dockerfile
      target: base
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9487/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 6
    networks:
      - ytdlp-warp-network
    container_name: ytdlp-worker-1
    volumes:
      - worker1-cookies:/tmp/ytdlp_cookies
    environment:
      - WORKER_ID=w1
      - API_PORT=9487
      - GRANIAN_WORKERS=2
      - STREAM_SECRET_KEY=${STREAM_SECRET_KEY:-dev-secret-key}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PYTHONPATH=/app:/app/yt_dlp
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0

  ytdlp-worker-2:
    <<: *ytdlp-worker-common
    container_name: ytdlp-worker-2
    volumes:
      - worker2-cookies:/tmp/ytdlp_cookies
    environment:
      - WORKER_ID=w2
      - API_PORT=9487
      - GRANIAN_WORKERS=2
      - STREAM_SECRET_KEY=${STREAM_SECRET_KEY:-dev-secret-key}
      - LOG_LEVEL=${LOG_LEVEL:-info}
