  redis:
    image: redis:7-alpine
    container_name: ytdlp-redis-wireproxy
    volumes:
      - redis-data:/data
    # Sessions hold live download links for an hour and share this instance with
    # the extraction cache. Measured at ~8KB per extraction, 256mb overflowed at
    # roughly 5 req/s sustained and eviction then took live sessions with it,
    # which surfaces to users as download links that expire on arrival.
    #
    # volatile-lru, not allkeys-lru: every key the engine writes carries a TTL
    # except metrics:tiktok_ssr:counters, so this evicts from the same candidate
    # set as before while making the one TTL-less key unevictable. That hash is
    # bounded (one field per name/label combination, a few hundred at most), so
    # protecting it cannot fill the instance. Under allkeys-lru it was the one
    # key whose eviction was silent and total: every counter to zero at once.
    command: redis-server --maxmemory 1gb --maxmemory-policy volatile-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ytdlp-wireproxy-network

  tiktok-ssr-engine:
    build:
      context: ../tiktok-ssr-engine
      dockerfile: Dockerfile
    image: tiktok-ssr-engine:latest
    container_name: tiktok-ssr-engine
    ports:
      - "9111:9111"
    environment:
      - PORT=9111
      - PROXY_COUNT=21
      - PROXY_HOST_PREFIX=wireproxy
      - PROXY_PORT=1080
      # INDONESIA_PROXIES is intentionally unset: the engine derives it from
      # runtime-configs/pool.json, so re-running the generator cannot leave a
      # hand-copied list pointing at nodes that moved out of Indonesia. Set it
      # here only to override what the manifest says.
      - TIKTOK_API_KEY=${TIKTOK_API_KEY}
      - REDIS_URL=redis://redis:6379/1
      - ALLOW_DIRECT_DOWNLOAD_FALLBACK=false
      - DOWNLOAD_PROXY_ATTEMPTS=3
      - MAX_EXTRACTION_TOUCHES=4
      # Once target-specific geo evidence exists, reserve two strict Indonesia
      # attempts even when the generic four-touch budget has already been used.
      - MAX_INDONESIA_TOUCHES=2
      - GEO_HINT_TTL=600
      - REQUEST_BLOCK_VERIFY_TIMEOUT=6
      - PROBE_TIMEOUT=12
      - PROBE_DEAD_AFTER=3
      - PROBE_URLS=https://1.1.1.1/cdn-cgi/trace,https://api.ipify.org
      - PROXY_CONTROL_VERDICT_TTL=330
      - BLOCK_CONFIRMATIONS=2
      - REQUEST_BLOCK_CONFIRMATIONS=2
      - BLOCK_PROBE_STARTUP_DELAY=30
      - WIREPROXY_RECONNECT_DIR=/var/run/wireproxy-reconnect
      - WARP_RECONNECT_COOLDOWN=300
      - WARP_RECONNECT_DRAIN_TIMEOUT=60
      - WARP_RECONNECT_DRAIN_POLL=1
      - WARP_RECONNECT_SCHEDULER_INTERVAL=1
      # Three liveness intervals (45s each) plus scheduling overhead. A 60s
      # window produced false verification failures and unnecessary quarantine.
      - WARP_RECONNECT_VERIFY_TIMEOUT=150
      - WARP_RECONNECT_STABILIZE=2
      - WARP_RECONNECT_BACKOFF_BASE=30
      - WARP_RECONNECT_BACKOFF_MAX=300
      - WARP_RECONNECT_BACKOFF_JITTER=5
      - WARP_RECONNECT_BUDGET_LIMIT=3
      - WARP_RECONNECT_BUDGET_WINDOW=600
      - WARP_RECONNECT_QUARANTINE=600
    volumes:
      - ./cookie/cookie.txt:/app/cookie/cookie.txt:ro
      # Country per node, written by scripts/generate-wireproxy-configs.py.
      # Only this file, not the whole runtime-configs directory: the .conf files
      # next to it hold WireGuard private keys the engine has no use for.
      - ./runtime-configs/pool.json:/app/runtime-configs/pool.json:ro
      - warp-reconnect-signals:/var/run/wireproxy-reconnect
    depends_on:
      # Redis is a hard dependency: without it every Granian worker
      # falls back to its own in-memory state and they stop agreeing
      # on which exits are blocked.
      redis:
        condition: service_healthy
      wireproxy-01: *tunnel_started
      wireproxy-02: *tunnel_started
      wireproxy-03: *tunnel_started
      wireproxy-04: *tunnel_started
      wireproxy-05: *tunnel_started
      wireproxy-06: *tunnel_started
      wireproxy-07: *tunnel_started
      wireproxy-08: *tunnel_started
      wireproxy-09: *tunnel_started
      wireproxy-10: *tunnel_started
      wireproxy-11: *tunnel_started
      wireproxy-12: *tunnel_started
      wireproxy-13: *tunnel_started
      wireproxy-14: *tunnel_started
      wireproxy-15: *tunnel_started
      wireproxy-16: *tunnel_started
      wireproxy-17: *tunnel_started
      wireproxy-18: *tunnel_started
      wireproxy-19: *tunnel_started
      wireproxy-20: *tunnel_started
      wireproxy-21: *tunnel_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9111/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - ytdlp-wireproxy-network

networks:
  ytdlp-wireproxy-network:
    driver: bridge

volumes:
  redis-data:
  warp-reconnect-signals:
