    command: ["python", "extractor/worker_server.py"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ytdlp-redis
    volumes:
      - redis-data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      ytdlp-warp-network:
        ipv4_address: 172.30.0.250

  gateway-warp:
    <<: *gateway_limits
    build:
      context: .
      dockerfile: gateway-go/Dockerfile
    container_name: ytdlp-gateway-warp
    ports:
      - "9111:9111"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - GATEWAY_PORT=9111
      - WORKER_COUNT=10
      - EXTRACTOR_IPC_ENABLED=true
      - EXTRACTOR_TIMEOUT_MS=90000
      - GLUETUN_PASSWORD=${GLUETUN_PASSWORD:-secretpassword}
      - MAX_RETRIES=3
      - HEALTH_CHECK_TIMEOUT_MS=15000
      - HEALTH_MONITOR_INTERVAL_MS=5000
      - HEALTH_FAILURE_THRESHOLD=3
      - RATE_LIMIT_COOLDOWN=300
      - DRAIN_POLL_INTERVAL_MS=350
      - DRAIN_TIMEOUT_SECONDS=120
      - RESTART_BACKOFF_BASE=10
      - RESTART_BACKOFF_MAX=90
      - RESTART_BACKOFF_JITTER=2
      - DEGRADED_RETRY_AFTER=5
      - DEGRADED_TIMEOUT_SECONDS=30
      - RESTART_STABILIZE_SECONDS=5
      - UNHEALTHY_RESTART_THRESHOLD=6
      - TIKTOK_SLIDESHOW_MAX_CONCURRENCY=1
    depends_on:
      redis:
        condition: service_started
      ytdlp-1:
        condition: service_healthy
      ytdlp-2:
        condition: service_healthy
      ytdlp-3:
        condition: service_healthy
      ytdlp-4:
        condition: service_healthy
      ytdlp-5:
        condition: service_healthy
      ytdlp-6:
        condition: service_healthy
      ytdlp-7:
        condition: service_healthy
      ytdlp-8:
        condition: service_healthy
      ytdlp-9:
        condition: service_healthy
      ytdlp-10:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ytdlp-warp-network

networks:
  ytdlp-warp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  redis-data:
