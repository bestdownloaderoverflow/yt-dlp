  ytdlp-worker-1:
    <<: *ytdlp_worker
    build:
      context: ..
      dockerfile: yt-dlp-wireproxy/Dockerfile
      target: base
    container_name: ytdlp-worker-1
    depends_on:
      - redis
    environment:
      - WORKER_ID=w1
      - STREAM_SECRET_KEY=${STREAM_SECRET_KEY:?set STREAM_SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TIKTOK_EXTRACT_CACHE_TTL_SECONDS=300
      - YTDLP_JS_RUNTIMES=deno:/usr/local/bin/deno
      - PYTHONPATH=/app:/app/yt_dlp
      - YTDLP_COOKIEFILE=/app/cookie/cookie.txt
      - REDIS_URL=redis://redis:6379/0
      - WORKER_COUNT=8
      - YTDLP_MAX_INSTANCES=0
    volumes:
      - ./cookie/cookie.txt:/app/cookie/cookie.txt:ro
    command: ["python", "extractor/worker_server.py"]
    restart: unless-stopped
    networks:
      - ytdlp-wireproxy-network

