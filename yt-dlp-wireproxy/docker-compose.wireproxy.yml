x-wireproxy: &wireproxy
  build:
    context: .
    dockerfile: wireproxy/Dockerfile
  image: ytdlp-wireproxy:v1.1.2
  command: ["--config", "/etc/wireproxy/wireproxy.conf", "--info", "0.0.0.0:9080"]

x-ytdlp-worker: &ytdlp_worker {}

x-gateway: &gateway {}

# Proxy pool layout (generated by scripts/generate-wireproxy-configs.py):
#   wireproxy-01 .. wireproxy-12  Surfshark  IPv4
#   wireproxy-13 .. wireproxy-17  Mullvad    IPv4
#   wireproxy-18 .. wireproxy-21  Cloudflare WARP
# Each geo key is pointed at a randomly chosen server across ID,SG,VN,MY,TH,PH,HK,
# so re-running the generator rerolls the exit IPs. The generator prints which
# indexes landed in Indonesia -- keep INDONESIA_PROXIES in sync with that.

services:
  wireproxy-01:
    <<: *wireproxy
    container_name: wireproxy-01
    volumes:
      - ./runtime-configs/wireproxy-01.conf:/etc/wireproxy/wireproxy.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9080/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ytdlp-wireproxy-network

  wireproxy-02:
